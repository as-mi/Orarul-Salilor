[project]
name = "orar"
version = "0.1.0"
description = "Orarul Salilor (FMI) - orar interactiv pe sali si grupe, cu ingest determinist local"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",          # sesiuni semnate (Etapa 7)
    "python-dotenv>=1.0",         # configurarea locala din `.env` (cheia de sesiune, adminul)
    # db
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # ingest
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.9",             # corectie lexicon (§3.3)
    "pillow>=10.0",
    "apscheduler>=3.10",          # verificarea zilnica a orarului (Etapa 6)
]

[project.optional-dependencies]
# Instalate doar cand se ruleaza ingestul din imagini (captura/segmentare/OCR).
# Tinute separat ca `pip install -e .` sa ramana rapid pentru munca la UI si la baza.
# OpenCV si Tesseract nu apar aici desi erau in plan: segmentarea s-a dovedit sa aiba
# nevoie doar de numpy, iar recunoasterea foloseste rapidocr (ONNX local, fara sudo).
# `orar planuri` mai cere si `pdftotext` (poppler-utils), care nu se instaleaza din pip.
ingest = [
    "playwright>=1.45",
    "numpy>=1.26",
    # Recunoastere locala, fara apeluri de retea. Fixata: `ocr.RapidOCR` foloseste
    # `text_recognizer`, pe care 1.3 l-a redenumit, iar 1.3+ nu se mai instaleaza pe
    # Python >= 3.13 fara --ignore-requires-python. Acuratetea din README e masurata pe 1.2.3.
    "rapidocr-onnxruntime==1.2.3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
orar = "orar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  # Ruleaza tot lantul de citire pe cele 98 de capturi: ~3 minute si modelul ONNX.
  # `pytest -m "not slow"` il sare.
  "slow: dureaza minute si cere data/screenshots/ plus modelul de recunoastere",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)`/`Query(...)` in argumente implicite e chiar idiomul FastAPI.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Migrarile sunt generate de Alembic; nu le reformatam manual.
"src/orar/db/migrations/versions/*" = ["UP", "I001"]
